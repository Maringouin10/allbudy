[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allbudy"
version = "0.1.0"
description = "Gestion de ferme d'impression 3D Creality, 100% locale (LAN/hors-ligne)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "websockets>=14",
  "python-multipart>=0.0.20",
  "PyJWT>=2.10",
  "cryptography>=44",
  "paramiko>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.8"]

[project.scripts]
allbudy = "allbudy.main:main"

[tool.setuptools.packages.find]
include = ["allbudy*"]

[tool.setuptools.package-data]
allbudy = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# B008: Depends() en valeur par defaut est l'idiome FastAPI.
# SIM105: contextlib.suppress n'apporte rien sur les fermetures best-effort.
# UP042: `str, Enum` reste volontaire (StrEnum changerait le rendu de str()).
ignore = ["B008", "SIM105", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
