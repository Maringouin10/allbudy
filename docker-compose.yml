services:
  allbudy:
    build: .
    image: allbudy:latest
    container_name: allbudy
    restart: unless-stopped

    # La decouverte reseau balaie le sous-reseau local: en mode "bridge", le
    # conteneur ne voit que le reseau Docker. Deux options:
    #   - host (recommande sur Linux / Raspberry Pi): decommentez la ligne
    #     network_mode et commentez le bloc "ports";
    #   - bridge: la decouverte automatique ne fonctionnera pas, mais vous
    #     pouvez ajouter les imprimantes a la main par leur adresse IP.
    # network_mode: host
    ports:
      - "8088:8088"

    volumes:
      - allbudy-data:/data

    environment:
      # AllBudy est concu pour un reseau local deja cloisonne: pas d'ecran de
      # connexion par defaut. Pour l'exposer au-dela, decommentez la ligne
      # suivante et protegez l'acces autrement (reverse proxy, VPN...).
      # ALLBUDY_AUTH_ENABLED: "true"
      # Rythme d'interrogation des machines, en secondes.
      ALLBUDY_POLL_INTERVAL: "2.0"
      ALLBUDY_MAX_UPLOAD_MB: "512"
      ALLBUDY_LOG_LEVEL: INFO
      # Imprimantes simulees creees au premier demarrage (0 = aucune).
      ALLBUDY_DEMO_PRINTERS: "0"

volumes:
  allbudy-data:
